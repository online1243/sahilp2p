<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahil P2P - Instant & Trusted USDT Exchange</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e293b 0%, #0b0f19 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 30px;
    }

    .wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Top Trust Bar */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50px;
      font-size: 13px;
    }

    .brand-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #22c55e;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.15); }
    }

    .chat-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: 0.2s;
    }

    .chat-btn:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    /* Main High-Converting Card */
    .card {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 24px 18px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .profile-container {
      position: relative;
      display: inline-block;
      margin-bottom: 12px;
    }

    .dp {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
    }

    .verified-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: #38bdf8;
      color: #0b0f19;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      border: 2px solid #0f172a;
    }

    .name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    /* Shiny Text Tagline */
    .shine-tagline {
      display: inline-block;
      margin-top: 4px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 600;
      background: linear-gradient(90deg, #94a3b8 0%, #ffffff 50%, #94a3b8 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShine 3s linear infinite;
    }

    @keyframes textShine {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    /* Key Trust Stats (Meta Conversion Trigger) */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 10px 4px;
      margin-bottom: 16px;
    }

    .stat-box h4 {
      font-size: 14px;
      font-weight: 800;
      color: #38bdf8;
    }

    .stat-box p {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Badges */
    .services-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .service-badge {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Primary Telegram CTA Button */
    .cta-link {
      text-decoration: none;
      display: block;
      width: 100%;
    }

    .cta-btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 56px;
      background: linear-gradient(135deg, #0088cc 0%, #006699 100%);
      border: none;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 136, 204, 0.45);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .cta-btn:active {
      transform: scale(0.98);
    }

    /* Shimmer Sweep Animation on CTA */
    .cta-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -100%;
      width: 50%;
      height: 200%;
      background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transform: rotate(25deg);
      animation: sweep 2.8s infinite;
    }

    @keyframes sweep {
      0% { left: -100%; }
      50%, 100% { left: 150%; }
    }

    .telegram-icon {
      width: 26px;
      height: 26px;
      fill: #ffffff;
      flex-shrink: 0;
    }

    /* Footer Trust Signals */
    .trust-footer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
      font-size: 11px;
      color: #64748b;
    }

    .trust-footer span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>

    <!-- Status Bar -->

      <!-- Trust Metrics -->
      <div class="stats-row">

      <div class="services-grid">
        <div class="service-badge">
          <i class="fa-solid fa-circle-down" style="color: #38bdf8;"></i> Bulk USDT Buy

        <div class="service-badge">
          <i class="fa-solid fa-indian-rupee-sign" style="color: #22c55e;"></i> Instant INR Sell

      </div>

      <!-- High-Converting CTA Button -->
      <a href="https://t.me/+uqK5wmHafw9lNmY1" target="_blank" class="cta-link">
        <button class="cta-btn">
          <svg class="telegram-icon" viewBox="0 0 496 512">
            <path d="M248 8C111 8 0 119 0 256S111 504 248 504 496 393 496 256 385 8 248 8zM363 176.7c-3.7 39.2-19.9 134.4-28.1 178.3-3.5 18.6-10.3 24.8-16.9 25.4-14.4 1.3-25.3-9.5-39.3-18.7-21.8-14.3-34.2-23.2-55.3-37.2-24.5-16.1-8.6-25 5.3-39.5 3.7-3.8 67.1-61.5 68.3-66.7 .2-.7 .3-3.1-1.2-4.4s-3.6-.8-5.1-.5q-3.3 .7-104.6 69.1-14.8 10.2-26.9 9.9c-8.9-.2-25.9-5-38.6-9.1-15.5-5-27.9-7.7-26.8-16.3q.8-6.7 18.5-13.7 108.4-47.2 144.6-62.3c68.9-28.6 83.2-33.6 92.5-33.8 2.1 0 6.6 .5 9.6 2.9a10.5 10.5 0 0 1 3.5 6.7A43.8 43.8 0 0 1 363 176.7z"/>
          </svg>
          Join Telegram For Best Rates
        </button>
      </a>

      <!-- Security Checklist -->
      <div class="trust-footer">
        <span><i class="fa-solid fa-shield-halved" style="color: #38bdf8;"></i> Bank Verified</span>
        <span>•</span>
        <span><i class="fa-solid fa-lock" style="color: #22c55e;"></i> Safe Escrow</span>
      </div>
    </div>
  </div>

</body>
</html>
